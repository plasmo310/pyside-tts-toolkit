[project]
name = "ttstoolkit"
version = "0.1.0"
description = "Drive Qwen3-TTS / Chatterbox / Irodori-TTS through one interface"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 共通層は torch に依存しない。各モデルの重い依存は engine_env/ 側で
# 作る .venvs/engine-* に隔離する。ここに入れるのは GUI だけ。
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/ttstoolkit"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".venvs",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "references",
    "site-packages",
    "venv",
    # ドキュメント。コード片は説明用の抜粋なので整形の対象にしない
    "docs",
    # 上流リポジトリの clone なので手を入れない
    "engine_env/irodori/vendor",
]

line-length = 79
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ttstoolkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
